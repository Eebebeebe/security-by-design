# CI: Qualitäts- und Sicherheits-Gates für jeden Push und Pull Request.
# Wird außerdem von release.yml (main) als Gate wiederverwendet (workflow_call).
#
# Supply Chain: Alle Actions sind per Commit-SHA gepinnt (Kommentar = Release-Tag).
# Ein Tag kann umgehängt werden, ein Commit-SHA nicht.
name: CI

on:
  push:
    branches-ignore: [main] # main läuft über release.yml (inkl. dieser Jobs)
  pull_request:
  workflow_call:

permissions:
  contents: read # Least Privilege: Default-Token darf nur lesen

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck, Dependency-Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (exakt nach Lockfile, ohne Install-Skripte)
        run: npm ci --ignore-scripts
      - name: ESLint (inkl. eslint-plugin-security)
        run: npm run lint
      - name: Statischer Typcheck
        run: npm run typecheck
      - name: npm audit (bekannte Schwachstellen, ab high)
        run: npm audit --audit-level=high
      - name: Lockfile-Integrität (Registry-Signaturen)
        run: npm audit signatures

  test:
    name: Anwendungstests (Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.12-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pizza_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d pizza_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/pizza_test
      DB_POOL_MAX: '5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Unit- und Integrationstests
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - name: Testbericht in Job-Summary
        if: always()
        run: node scripts/junit-summary.mjs test-results/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

  image:
    name: Docker-Build + Image-Scan (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [quality]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image bauen (lokal, ohne Push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: pizza-shop:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy – Schwachstellen im Image (bricht ab bei HIGH/CRITICAL mit Fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pizza-shop:ci
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Smoke-Test – Container startet nicht ohne sichere Konfiguration (Fail Fast)
        run: |
          set +e
          docker run --rm -e DATABASE_URL=postgres://x:y@localhost/z pizza-shop:ci
          code=$?
          echo "Exit-Code ohne ADMIN_PASSWORD: $code"
          test "$code" -eq 78
